spring.application.name=task-manager

# MySQL — ensure the server is running. Creates schema `taskmanager` if missing (requires privileges).
spring.datasource.url=jdbc:mysql://localhost:3306/taskmanager?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT — use a long random secret in production (>= 32 bytes for HS256)
jwt.secret=taskmanager-dev-secret-key-change-me-32b-min!!
jwt.expiration-ms=86400000

# CORS — comma-separated origins for the React dev server(s)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
